<div class="space-y-1">
  @if (!collapsed()) {
    <p class="px-3 font-display text-[9px] font-semibold tracking-[0.25em] text-ink-tertiary">
      PRINCIPAL
    </p>
  }
  <ul class="space-y-0.5">
    @for (item of menuItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="py-1 my-1 bg-brand-500 text-white font-semibold shadow-brand"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="onClick()"
          [attr.title]="collapsed() ? item.label : null"
          class="relative flex items-center rounded-sm text-sm text-ink-secondary hover:bg-surface-2 hover:text-ink-primary transition"
          [class.gap-2\.5]="!collapsed()"
          [class.px-3]="!collapsed()"
          [class.py-2\.5]="!collapsed()"
          [class.justify-center]="collapsed()"
          [class.h-11]="collapsed()"
          [class.w-11]="collapsed()"
          [class.mx-auto]="collapsed()"
        >
          <span class="material-symbols-rounded text-[20px] shrink-0">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span class="py-2 my-2 flex-1 truncate">{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>
</div>
