<div class="space-y-1">
  @if (!collapsed()) {
    <p class="px-3 font-display text-[9px] font-semibold tracking-[0.25em] text-ink-tertiary">
      PRINCIPAL
    </p>
  }
  <ul class="space-y-0.5">
    @for (item of menuItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-brand-500 text-white font-semibold shadow-brand"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          (click)="onClick()"
          [attr.title]="collapsed() ? item.label : null"
          class="relative group flex items-center rounded-sm text-sm text-ink-secondary hover:bg-surface-2 hover:text-ink-primary transition"
          [class.gap-2\.5]="!collapsed()"
          [class.px-3]="!collapsed()"
          [class.py-2\.5]="!collapsed()"
          [class.justify-center]="collapsed()"
          [class.h-11]="collapsed()"
          [class.w-11]="collapsed()"
          [class.mx-auto]="collapsed()"
        >
          <span class="material-symbols-rounded text-[20px] shrink-0">{{ item.icon }}</span>

          @if (!collapsed()) {
            <span class="flex-1 truncate">{{ item.label }}</span>
            @if (badgeFor(item) > 0) {
              <span
                class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 text-[10px] font-mono font-bold rounded-full bg-brand-500 text-white shadow-brand"
              >
                {{ badgeFor(item) }}
              </span>
            }
          } @else {
            @if (badgeFor(item) > 0) {
              <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-brand-500 ring-2 ring-surface-1"></span>
            }
          }
        </a>
      </li>
    }
  </ul>
</div>
